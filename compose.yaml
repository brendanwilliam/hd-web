services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hd
      POSTGRES_USER: hd
      POSTGRES_PASSWORD: hd
    ports:
      - "5433:5432"
    volumes:
      - hd_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hd -d hd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hd_postgres:
