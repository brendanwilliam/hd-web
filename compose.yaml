services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: handscheck
      POSTGRES_USER: handscheck
      POSTGRES_PASSWORD: handscheck
    ports:
      - "5433:5432"
    volumes:
      - handscheck_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handscheck -d handscheck"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  handscheck_postgres:
